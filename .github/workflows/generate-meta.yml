name: Generate Meta

on:
  push:
    branches:
      - main

jobs:
  generate-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate-meta.js
        run: node generate-meta.js

      - name: Commit and push data/meta.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta.js
          git diff --cached --quiet || git commit -m "chore: update data/meta.js [skip ci]"
          git push
